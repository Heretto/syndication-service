[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syndication-service"
version = "0.1.0"
description = "DITA → knowledge-base syndication service built on hop-core"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "hop-core @ file:///Users/Jarod/_heretto/hop-core",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.29.0",
    "lxml>=5.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "respx>=0.21",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["syndication*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
