services:
  backend:
    build:
      context: ../
      dockerfile: syndication-service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/syndication.db
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - APP_SECRET_KEY=${APP_SECRET_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - DEPLOY_DEFAULT_AUDIENCE=${DEPLOY_DEFAULT_AUDIENCE:-private}
    volumes:
      - db-data:/app/data

  frontend:
    build:
      context: ../
      dockerfile: syndication-service/frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
