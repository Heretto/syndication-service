name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install hop-core
        run: pip install --no-cache-dir ../hop-core
        working-directory: syndication-service

      - name: Install syndication-service dependencies
        run: |
          pip install --no-cache-dir \
            apscheduler \
            "httpx>=0.27.0" \
            "uvicorn[standard]" \
            lxml \
            python-multipart \
            python-dotenv \
            alembic \
            "slowapi>=0.1.9" \
            pyyaml \
            respx \
            pytest \
            pytest-asyncio \
            anyio
          pip install --no-cache-dir -e .
        working-directory: syndication-service

      - name: Run tests
        run: python -m pytest
        working-directory: syndication-service

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: syndication-service/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: syndication-service/frontend

      - name: Build Angular app
        run: npx ng build --configuration=production
        working-directory: syndication-service/frontend
