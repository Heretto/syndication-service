name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check out hop-core
        uses: actions/checkout@v5
        with:
          repository: Heretto/hop-core
          path: hop-core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install hop-core
        run: pip install --no-cache-dir ./hop-core

      - name: Install syndication-service dependencies
        run: |
          pip install --no-cache-dir \
            "apscheduler==3.10.4" \
            "httpx==0.27.0" \
            "uvicorn[standard]==0.29.0" \
            "lxml==5.2.1" \
            "python-multipart==0.0.9" \
            "python-dotenv==1.0.1" \
            "alembic==1.13.3" \
            "slowapi==0.1.9" \
            "pyyaml==6.0.2" \
            "respx==0.21.1" \
            "pytest==8.3.3" \
            "pytest-asyncio==0.24.0" \
            "anyio[trio]==4.6.0"
          pip install --no-cache-dir -e .

      - name: Run tests
        run: python -m pytest

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check out hop-core (sibling path, matches local dev structure)
        run: git clone --depth 1 https://github.com/Heretto/hop-core.git ../hop-core

      - name: Build hop-ui
        working-directory: ../hop-core/ui
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Install frontend dependencies
        run: npm install --no-fund --no-audit
        working-directory: frontend

      - name: Build Angular app
        run: npx ng build --configuration=production
        working-directory: frontend
